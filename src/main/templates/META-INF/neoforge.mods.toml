modLoader="javafml"
loaderVersion="${loader_version_range}"
issueTrackerURL="https://github.com/LopyLuna/Create-Dreams-and-Desires/issues"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://discord.gg/w5VCHxu6Uv"
logoFile="icon.png"
